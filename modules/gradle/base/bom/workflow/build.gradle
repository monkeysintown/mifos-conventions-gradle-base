plugins {
    id "org.mifos.conventions.gradle.internal.bom"
}

description = "Mifos Initiative - Conventions - Gradle - Base - BOM - Workflow"

dependencies {

    api platform("org.flowable:flowable-bom:8.0.0")

    api platform("org.cibseven.bpm:cibseven-bom:2.2.0")

    api platform("org.eximeebpms.bpm:eximeebpms-bom:1.3.0")

    api platform("org.operaton.bpm:operaton-bom:2.2.0-M3")

    api platform("io.temporal:temporal-bom:1.38.0")

    api platform("io.namastack:namastack-outbox-bom:1.8.1")

    // NOTE: important to select one that is compatible with the latest Camunda Spring Boot starters!
    api platform("io.camunda:zeebe-bom:8.9.14")
    api platform("io.camunda:camunda-bom:8.9.14")

    api "dev.dbos:transact:1.1.0-m8"
    api "dev.dbos:transact-jooq-step-factory:1.1.0-m8"
    api "dev.dbos:transact-spring-txstep-starter:1.1.0-m8"
    api "dev.dbos:transact-spring-boot-starter:1.1.0-m8"
    api "dev.dbos:transact-jdbi-step-factory:1.1.0-m8"

    api "dev.restate:sdk-api:2.9.4"
    api "dev.restate:sdk-spring-boot-starter:2.9.4"
    api "dev.restate:sdk-api-gen:2.9.4"
    api "dev.restate:sdk-java-http:2.9.4"
    api "dev.restate:sdk-java-lambda:2.9.4"

    api "com.uber.cadence:cadence-client:4.0.0"
    api "io.orkes.conductor:orkes-conductor-client-spring:6.0.0.rc1"
    api "io.orkes.conductor:orkes-conductor-client:6.0.0.rc1"
    api "org.rocksdb:rocksdbjni:10.10.1.1"
}
