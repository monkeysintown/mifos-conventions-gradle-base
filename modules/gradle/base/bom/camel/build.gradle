plugins {
    id "org.mifos.conventions.gradle.internal.bom"
}

description = "Mifos Initiative - Conventions - Gradle - Base - BOM - Camel"

dependencies {
    api platform("org.apache.camel:camel-bom:4.22.0")

    api platform("org.apache.camel.springboot:camel-spring-boot-dependencies:4.22.0") {
        exclude group: "com.google.guava", module: "guava"
        exclude group: "com.google.guava", module: "listenablefuture"
    }
}
