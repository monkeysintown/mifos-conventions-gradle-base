            implementation "org.geotools:gt-shapefile:35.0"
            implementation "org.geotools:gt-referencing:35.0"
            implementation "org.geotools:gt-opengis:35.0"
            implementation "org.geotools:gt-geojson:35.0"
            implementation "org.geotools:gt-cql:35.0"
            implementation "org.geotools:gt-coverage:35.0"
